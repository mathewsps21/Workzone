<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}</style>
<link rel="icon" href="__CDN__m/workzone-logo.png">
<title>WorkZone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
</head><body>
<style>


/* Layout: mesa de revisão da agência — áreas por perfil + fila de posts | peça com marcações | avaliação, correções e ficha */
:root{
  --bg:#f2f4f1; --panel:#ffffff; --line:#dae1db; --fg:#0f1511; --muted:#5a685f;
  --accent:#0a9a3f; --accent-fg:#ffffff; --soft:#e3f2e7;
  --ok:#0a9a3f; --warn:#a86300; --warn-soft:#fcefd8; --bad:#c0362c;
  --pin:#0abb4b; --pin-fg:#04120a; --stage:#e6eae5; --tab:#eef1ee; --marca-bg:#0a0e0c; --titulo-tam:26px;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Montserrat","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
/* identidade por perfil (claro) */
:root[data-area="bantim"]{--bg:#f3f5fb;--panel:#ffffff;--line:#d9deee;--fg:#121633;--muted:#5a6280;--accent:#1230b8;--accent-fg:#ffffff;--soft:#e7ebfb;--pin:#e3262e;--pin-fg:#ffffff;--stage:#e6e9f4;--tab:#edf0f8;--marca-bg:#16186b;
  --display:"Lemon Milk","Arial Black",sans-serif;--body:"Poppins","Segoe UI",system-ui,sans-serif;--titulo-tam:22px}
:root[data-area="campista"]{--bg:#f7f4f0;--panel:#ffffff;--line:#e6ddd4;--fg:#1d1512;--muted:#6c625b;--accent:#d71920;--accent-fg:#ffffff;--soft:#fde8e4;--pin:#f5b400;--pin-fg:#1d1200;--stage:#e4e9f4;--tab:#f2ece6;--marca-bg:transparent;
  --display:"Bellfort Draw","Georgia",serif;--body:"Poppins","Segoe UI",system-ui,sans-serif;--titulo-tam:30px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0e0c; --panel:#111814; --line:#213028; --fg:#edf3ee; --muted:#93a39a;
  --accent:#0abb4b; --accent-fg:#03110a; --soft:#10281a;
  --ok:#2fcf6a; --warn:#f0b84a; --warn-soft:#2d2310; --bad:#ff7a6e;
  --pin:#0abb4b; --stage:#060908; --tab:#0c120f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0e0c; --panel:#111814; --line:#213028; --fg:#edf3ee; --muted:#93a39a;
  --accent:#0abb4b; --accent-fg:#03110a; --soft:#10281a;
  --ok:#2fcf6a; --warn:#f0b84a; --warn-soft:#2d2310; --bad:#ff7a6e;
  --pin:#0abb4b; --stage:#060908; --tab:#0c120f; color-scheme:dark}
@media (prefers-color-scheme:dark){
 :root[data-area="bantim"]:not([data-theme="light"]){--bg:#090c1c;--panel:#10152b;--line:#232b4d;--fg:#eef0fb;--muted:#98a0c4;--accent:#7f9bff;--accent-fg:#071038;--soft:#18214a;--pin:#ff4a52;--pin-fg:#ffffff;--stage:#05070f;--tab:#0c1024;--marca-bg:#16186b}
 :root[data-area="campista"]:not([data-theme="light"]){--bg:#0e0b0a;--panel:#181210;--line:#33261f;--fg:#f6efea;--muted:#b0a29a;--accent:#ff4d4d;--accent-fg:#200404;--soft:#341614;--pin:#ffc21a;--pin-fg:#1d1200;--stage:#0a0d18;--tab:#120d0b}}
:root[data-theme="dark"][data-area="bantim"]{--bg:#090c1c;--panel:#10152b;--line:#232b4d;--fg:#eef0fb;--muted:#98a0c4;--accent:#7f9bff;--accent-fg:#071038;--soft:#18214a;--pin:#ff4a52;--pin-fg:#ffffff;--stage:#05070f;--tab:#0c1024;--marca-bg:#16186b}
:root[data-theme="dark"][data-area="campista"]{--bg:#0e0b0a;--panel:#181210;--line:#33261f;--fg:#f6efea;--muted:#b0a29a;--accent:#ff4d4d;--accent-fg:#200404;--soft:#341614;--pin:#ffc21a;--pin-fg:#1d1200;--stage:#0a0d18;--tab:#120d0b}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:290px minmax(0,1fr) 380px;height:100%;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
/* fila */
.fila{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.fila header{padding:16px 14px 12px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.logo{width:170px;height:auto;display:block}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--tab);padding:4px;border-radius:10px}
.areas button{border:0;background:none;border-radius:7px;padding:7px 4px;font-weight:700;font-size:12px;line-height:1.2;display:grid;gap:2px}
.areas button small{font-weight:500;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.areas button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.areas button[aria-pressed="true"] small{color:var(--accent)}
.resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.resumo button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center}
.resumo button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.resumo .n{display:block;font-family:var(--display);font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
.resumo .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
.lista{overflow:auto;flex:1;padding:6px 8px 16px;display:grid;align-content:start;gap:2px}
.item{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;border:0;background:none;text-align:left;width:100%}
.item:hover{background:var(--soft)}
.item[aria-current="true"]{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.item img{width:40px;height:53px;object-fit:cover;border-radius:3px;background:var(--stage)}
.item .c{font-family:var(--mono);font-size:11px;color:var(--muted)}
.item .t{font-weight:600;font-size:12.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .meta{display:grid;justify-items:end;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.dot.aprovado{background:var(--ok);border-color:var(--ok)}
.dot.ajustar{background:var(--warn);border-color:var(--warn)}
.dot.reprovado{background:var(--bad);border-color:var(--bad)}
.cnt{font-size:10.5px;font-family:var(--mono);color:var(--muted)}
/* palco */
.palco{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--stage)}
.barra{display:flex;align-items:center;gap:12px;padding:12px 18px;flex-wrap:wrap}
.barra .tt{display:grid;gap:2px;flex:1;min-width:200px}
.barra .cod{font-family:var(--mono);color:var(--accent);font-size:12.5px}
.barra h1{font-family:var(--display);font-weight:400;font-size:var(--titulo-tam);letter-spacing:.3px;margin:0;line-height:1.05;text-wrap:balance}
.nav{display:flex;gap:6px}
.marca{height:44px;width:auto;max-width:150px;object-fit:contain;padding:6px 10px;border-radius:8px;background:var(--marca-bg);flex:none}
.palco,.fila,.ficha,body{transition:background-color .25s}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.5;cursor:default}
.vista{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 64px;position:relative}
.quadro{position:relative;height:100%;max-height:100%;max-width:100%;user-select:none}
.quadro img,.quadro video{width:100%;height:100%;display:block;border-radius:4px;box-shadow:0 10px 30px rgba(0,0,0,.25);background:#000}
.camada{position:absolute;inset:0;cursor:crosshair}
.quadro.video .camada{bottom:64px}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--pin);color:var(--pin-fg);
  font-weight:700;font-size:12px;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);cursor:pointer;padding:0}
.pin.res{background:#8a958f;opacity:.75}
.pin.novo{background:#fff;color:#111;border-color:var(--pin);pointer-events:none}
.pin.on{outline:3px solid var(--warn);outline-offset:1px}
.seta{position:absolute;top:50%;transform:translateY(-50%);border:0;background:var(--panel);border-radius:50%;width:40px;height:40px;font-size:18px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.seta.esq{left:12px}.seta.dir{right:12px}
.seta:disabled{opacity:.3;cursor:default}
.tiras{display:flex;gap:8px;padding:10px 18px 14px;overflow-x:auto;justify-content:center}
.tira{border:2px solid transparent;border-radius:4px;padding:0;background:none;position:relative;flex:none}
.tira img{height:64px;width:auto;display:block;border-radius:2px}
.tira[aria-current="true"]{border-color:var(--accent)}
.tira .r{position:absolute;left:2px;bottom:2px;font-size:9px;font-weight:700;background:rgba(0,0,0,.65);color:#fff;border-radius:3px;padding:0 4px}
.tira .b{position:absolute;top:-6px;right:-6px;background:var(--warn);color:#1a1000;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.dica{font-size:12px;color:var(--muted);text-align:center;padding:0 18px 6px}
/* ficha */
.ficha{border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-height:0;display:flex;flex-direction:column}
.sec{padding:16px 18px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sec h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:700}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;font-weight:500}
.alerta{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-weight:600;font-size:12.5px}
.aval{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.aval button{border:1px solid var(--line);background:none;border-radius:8px;padding:9px 4px;font-weight:700;font-size:12.5px}
.aval button:disabled{opacity:.5;cursor:default}
.aval button[data-v="aprovado"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--accent-fg)}
.aval button[data-v="ajustar"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#1a1000}
.aval button[data-v="reprovado"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.quem{font-size:12px;color:var(--muted)}
.composer{display:grid;gap:8px}
.composer .alvo{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:none}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);font-weight:600}
textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:inherit;background:var(--bg);color:var(--fg)}
.notas{display:grid;gap:8px}
.nota{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--bg)}
.nota.on{border-color:var(--warn)}
.nota.res{opacity:.6}
.nota.res .tx{text-decoration:line-through}
.nota .top{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.nota .tag{font-family:var(--mono);font-size:11px;background:var(--soft);color:var(--fg);border-radius:4px;padding:1px 6px;cursor:pointer;border:0}
.nota .tx{white-space:pre-wrap;word-break:break-word}
.nota .acoes{display:flex;gap:12px}
.nota .acoes button{border:0;background:none;padding:0;font-size:12px;font-weight:600;color:var(--muted)}
.nota .acoes button:hover{color:var(--accent)}
.vazio{color:var(--muted);font-size:13px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;width:max-content}
.st.enviada{background:var(--soft);color:var(--accent)}
.st.ajustando{background:var(--warn-soft);color:var(--warn)}
.st.ajustada{background:var(--soft);color:var(--ok)}
.st.ajustando::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulsa 1.2s infinite}
@keyframes pulsa{50%{opacity:.25}}
.resp{border-left:3px solid var(--accent);padding:4px 0 4px 10px;font-size:13px;white-space:pre-wrap}
.resp b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.envio{display:grid;gap:6px}
.envio .btn{width:100%}
.envio small{color:var(--muted);font-size:12px}
.filaClaude{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px}
.filaClaude b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--accent);margin-right:4px;font-variant-numeric:tabular-nums}
.filaClaude button{border:0;background:var(--accent);color:var(--accent-fg);border-radius:7px;padding:6px 10px;font-weight:700;font-size:12px}
.filaClaude button:disabled{opacity:.4;cursor:default}
.legenda{white-space:pre-wrap;font-size:13px;line-height:1.55;background:var(--bg);border-radius:8px;padding:10px 12px;max-height:260px;overflow:auto}
.estado{font-size:12px;color:var(--muted);padding:8px 18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:600;font-size:13px;z-index:20}
@media (max-width:1100px){html,body{height:auto}.app{grid-template-columns:260px minmax(0,1fr);height:auto}.ficha{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.palco{height:82vh}.fila{max-height:82vh}}
@media (max-width:720px){.app{display:flex;flex-direction:column;padding-left:0;padding-right:0}.fila{max-height:none}
  .lista{display:flex;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-left,0px))}.item{grid-template-columns:40px;width:auto;flex:none}.item .t,.item .c,.item .meta .cnt{display:none}
  .fila header,.barra,.sec,.tiras,.estado{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .palco{height:auto}.vista{height:72vh;padding:4px 16px}.seta{display:none}.tiras{justify-content:flex-start}}
/* ===== Planner (quadros estilo Trello) ===== */
[hidden]{display:none!important}
.modos{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--tab);padding:4px;border-radius:10px}
.modos button{border:0;background:none;border-radius:7px;padding:7px 4px;font-weight:700;font-size:12.5px}
.modos button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.pl{display:flex;flex-direction:column;height:100%;min-height:0;background:var(--stage);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.pl-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-left,0px)) 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.pl-top .logo{width:120px}
.pl-top .modos{width:210px}
.quadros{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.quadros button{border:1px solid var(--line);background:none;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px;white-space:nowrap}
.quadros button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--fg)}
.quadros button small{font-weight:500;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.pl-barra{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px max(16px,env(safe-area-inset-left,0px))}
.pl-barra h2{font-family:var(--display);font-weight:400;font-size:var(--titulo-tam);margin:0 8px 0 0;letter-spacing:.3px;line-height:1.05}
.pl-barra input[type=search],.pl-barra select{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;max-width:100%}
.pl-barra input[type=search]{width:220px}
.pl-barra .sep{flex:1}
.pl-barra .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.seg{display:inline-grid;grid-auto-flow:column;gap:2px;background:var(--tab);padding:3px;border-radius:8px}
.seg button{border:0;background:none;border-radius:6px;padding:5px 10px;font-weight:700;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pl-aviso{margin:0 max(16px,env(safe-area-inset-left,0px)) 8px;font-size:12.5px;color:var(--muted)}
.board{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;display:flex;align-items:flex-start;gap:12px;padding:4px max(16px,env(safe-area-inset-left,0px)) 16px}
.col{flex:0 0 280px;max-height:100%;display:flex;flex-direction:column;background:var(--tab);border:1px solid var(--line);border-radius:12px;min-height:0}
.col.recolhida{flex-basis:44px}
.col.recolhida .col-corpo,.col.recolhida .col-add,.col.recolhida .col-n{display:none}
.col.recolhida .col-h h3{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.col.recolhida .col-h{flex-direction:column;align-items:center;padding:10px 4px}
.col-h{display:flex;align-items:center;gap:6px;padding:10px 10px 6px 12px;cursor:grab}
.col-h h3{margin:0;font-size:13.5px;font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.col-h input{flex:1;min-width:0;font:inherit;font-weight:700;font-size:13.5px;border:1px solid var(--accent);border-radius:6px;padding:3px 6px;background:var(--panel);color:var(--fg)}
.col-n{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--panel);border-radius:999px;padding:1px 8px}
.ic{border:0;background:none;border-radius:6px;width:28px;height:28px;display:grid;place-items:center;color:var(--muted);font-size:16px;line-height:1;flex:none}
.ic:hover{background:var(--soft);color:var(--fg)}
.col-corpo{overflow-y:auto;padding:4px 8px;display:grid;gap:8px;align-content:start;min-height:12px}
.col.alvo-drop{outline:2px dashed var(--accent);outline-offset:-2px}
.cartao{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;display:grid;gap:6px;cursor:pointer;text-align:left;width:100%;box-shadow:0 1px 1px rgba(0,0,0,.06)}
.cartao:hover{border-color:var(--accent)}
.cartao.arq{opacity:.6;border-style:dashed}
.cartao.arrastando{opacity:.35}
.cartao .t{font-size:13.5px;font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.etqs{display:flex;flex-wrap:wrap;gap:4px}
.etq{border-radius:4px;font-size:11px;font-weight:700;padding:1px 7px;line-height:16px;min-width:36px;min-height:8px}
.etqs.min .etq{font-size:0;padding:0;height:8px;width:40px;min-width:40px}
.badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11.5px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:1px 5px}
.badge.prazo.ok{background:var(--ok);color:var(--accent-fg)}
.badge.prazo.atraso{background:var(--bad);color:#fff}
.badge.prazo.perto{background:var(--warn);color:#1a1000}
.badge.ck.cheio{background:var(--ok);color:var(--accent-fg)}
.avs{display:flex;gap:2px;margin-left:auto}

<script>
const AREAS = JSON.parse(document.getElementById('dados').textContent);
const $ = id => document.getElementById(id);
let area = 0, cur = 0, sl = 0, filtro = 'todos';
let status = {}, notas = [], db = null, user = null, assets = null, downloads = null, meuId = null, dono = false, podeEscrever = false;
let alvo = { tipo: 'slide' };
let focoNota = null, video = null;
const P = () => AREAS[area].posts;
const post = () => P()[cur];
const midia = () => post().midias[sl];

function toast(t){ const el=$('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2400); }
function estadoDe(c){ return status[c]?.estado || ''; }
function abertas(c){ return notas.filter(n=>n.post===c && !n.resolvida).length; }
function quando(ts){ try{ return new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }
function mmss(t){ t=Math.max(0,Math.round(t||0)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function capaDe(m){ return m.tipo==='video'? m.capa : m.src; }

function visiveis(){
  return P().map((p,i)=>i).filter(i=>{ const e=estadoDe(P()[i].cod); return filtro==='todos' || (filtro==='sem' ? !e : e===filtro); });
}

function renderAreas(){
  const A=$('areas'); A.textContent='';
  AREAS.forEach((a,i)=>{
    const b=document.createElement('button'); b.setAttribute('aria-pressed',i===area?'true':'false');
    const sem=a.posts.filter(p=>!estadoDe(p.cod)).length;
    b.append(document.createTextNode(a.nome)); const s=document.createElement('small'); s.textContent = sem ? sem+' a avaliar' : 'tudo avaliado'; b.append(s);
    b.onclick=()=>{ if(i!==area){ area=i; filtro='todos'; marcaFiltro(); ir(0,0); } };
    A.append(b);
  });
}
function marcaFiltro(){ document.querySelectorAll('.resumo button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.f===filtro?'true':'false')); }

function renderLista(){
  renderAreas();
  const L=$('lista'); L.textContent='';
  const vis=visiveis();
  if(!vis.length){ const d=document.createElement('div'); d.className='vazio'; d.style.padding='12px'; d.textContent='Nenhum post neste filtro.'; L.append(d); }
  for(const i of vis){
    const p=P()[i]; const b=document.createElement('button'); b.className='item';
    b.setAttribute('aria-current', i===cur?'true':'false');
    const im=document.createElement('img'); im.src=capaDe(p.midias[0]); im.loading='lazy'; im.alt='';
    const tx=document.createElement('div'); const c=document.createElement('div'); c.className='c'; c.textContent=p.cod+(p.midias[0].tipo==='video'?' · vídeo':'');
    const t=document.createElement('div'); t.className='t'; t.textContent=p.titulo; tx.append(c,t);
    const m=document.createElement('div'); m.className='meta';
    const d=document.createElement('span'); d.className='dot '+estadoDe(p.cod); d.title=estadoDe(p.cod)||'a avaliar'; m.append(d);
    const a=abertas(p.cod); if(a){ const n=document.createElement('span'); n.className='cnt'; const aj=notas.some(x=>x.post===p.cod&&!x.resolvida&&x.fila==='ajustando'); const cf=notas.some(x=>x.post===p.cod&&!x.resolvida&&x.fila==='ajustada'); n.textContent= aj?'Claude ajustando': cf?'conferir ajuste': a+' nota'+(a>1?'s':''); m.append(n); }
    b.append(im,tx,m); b.onclick=()=>ir(i,0); L.append(b);
  }
  const cont={sem:0,ajustar:0,aprovado:0};
  P().forEach(p=>{ const e=estadoDe(p.cod); if(!e) cont.sem++; else if(cont[e]!==undefined) cont[e]++; });
  $('n-todos').textContent=P().length; $('n-sem').textContent=cont.sem; $('n-ajustar').textContent=cont.ajustar; $('n-aprovado').textContent=cont.aprovado;
}

function notasDoPost(){ return notas.filter(n=>n.post===post().cod).sort((a,b)=>a.em-b.em); }

function montarMidia(){
  const Q=$('quadro'); Q.textContent=''; video=null;
  const m=midia(); Q.style.aspectRatio=m.w+'/'+m.h; Q.className='quadro'+(m.tipo==='video'?' video':'');
  if(m.tipo==='video'){
    video=document.createElement('video'); video.src=m.src; video.poster=m.capa; video.controls=true; video.playsInline=true; video.preload='metadata';
    video.addEventListener('timeupdate',desenharPins); video.addEventListener('seeked',desenharPins);
    Q.append(video);
  } else { const im=document.createElement('img'); im.src=m.src; im.alt=post().cod+' '+m.rot; im.id='peca'; Q.append(im); }
  const cam=document.createElement('div'); cam.className='camada'; cam.id='camada'; cam.addEventListener('click',marcar); Q.append(cam);
  $('dica').textContent = m.tipo==='video'
    ? 'Pause no momento da correção e clique no vídeo para marcar o ponto · J / K troca de post'

function passaFiltro(c){
  const f=PL.f;
  if(!f.arq && c.arquivado) return false;
  if(f.arq && !c.arquivado) return false;
  if(f.txt){ const t=f.txt.toLowerCase(); if(!(c.titulo||'').toLowerCase().includes(t) && !(c.desc||'').toLowerCase().includes(t)) return false; }
  if(f.etq && !(c.etiquetas||[]).some(id=>PL.E[id]?.nome===f.etq)) return false;
  if(f.mem && !(c.membros||[]).includes(f.mem==='__eu'?meuNome():f.mem)) return false;
  if(f.prazo){ const ep=estadoPrazo(c);
    if(f.prazo==='atraso' && ep!=='atraso') return false;
    if(f.prazo==='semana' && !(c.prazo && !c.prazoFeito && new Date(c.prazo)-Date.now()>=0 && new Date(c.prazo)-Date.now()<7*864e5)) return false;
    if(f.prazo==='sem' && c.prazo) return false; }
  return true;
}

function soltarCard(cid, lid, idx){

const TIPOS_OK={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',mp4:'video/mp4',webm:'video/webm',pdf:'application/pdf',txt:'text/plain',csv:'text/csv',md:'text/markdown',json:'application/json'};
function fmtTam(b){ if(!b && b!==0) return ''; if(b<1024) return b+' B'; if(b<1048576) return Math.round(b/1024)+' KB'; return (b/1048576).toFixed(1).replace('.',',')+' MB'; }
function tipoDeArquivo(f){ const ext=(f.name.split('.').pop()||'').toLowerCase(); const porExt=TIPOS_OK[ext]; if(Object.values(TIPOS_OK).includes(f.type)) return f.type; return porExt||null; }
async function enviarArquivos(cid, files){
  if(!podeMexer()) return;
  if(!assets){ toast('Seu acesso não permite enviar arquivos. Anexe um link (ex.: do Google Drive).'); return; }
  for(const f of files){
    const tipo=tipoDeArquivo(f);
    if(!tipo){ toast('“'+f.name+'” não pode ser enviado aqui (aceita imagem, vídeo MP4/WebM, PDF e texto). Coloque no Drive e anexe o link.'); continue; }
    const lim = tipo==='image/svg+xml' ? 2*1048576 : 20*1048576;
    if(f.size>lim){ toast('“'+f.name+'” passa de '+(lim/1048576)+' MB. Coloque no Drive e anexe o link.'); continue; }
    toast('Enviando “'+f.name+'”…');
    try{
      const r=await assets.upload(f,{type:tipo});
      const c=PL.C[cid]; if(!c) return;
      const ax={id:'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),tipo:'arquivo',nome:f.name,asset:r.id,mime:r.contentType,tam:r.sizeBytes,em:agoraISO(),por:meuId};
      const campos={anexos:[...(c.anexos||[]),ax]}; if(!c.capa && tipo.startsWith('image/')) campos.capa=r.id;
      await salvarCard(cid,campos,'anexou '+f.name+' a este cartão'); toast('Anexo adicionado');
    }catch(e){
      const m={too_large:'O arquivo passa do limite de 20 MB. Use um link do Drive.',unsupported_type:'Esse tipo de arquivo não é aceito. Use um link do Drive.',quota_or_state:'O espaço de anexos do WorkZone está cheio.',rate_limited:'Muitos envios seguidos. Espere um pouco e tente de novo.',not_granted:'Seu acesso não permite enviar arquivos. Anexe um link.'}[e?.code];
      toast(m||'Não foi possível enviar “'+f.name+'”.');
    }
  }
}

async function baixarAnexo(a){
  if(!downloads){ toast('Download indisponível aqui.'); return; }
  try{ const r=await fetch(await blobUrlAsync(a.asset)); if(!r.ok) throw 0; const bl=await r.blob(); await downloads.save({filename:a.nome||'anexo',data:bl}); }
  catch(e){ const m={declined:null,rejected_extension:'Esse tipo de arquivo não pode ser baixado por aqui.',rate_limited:'Espere um instante e tente de novo.'}[e?.code]; if(m!==null) toast(m||'Não foi possível baixar o arquivo.'); }
}

      let feito=false; const fim=s=>{ if(feito) return; feito=true; const v=i.value.trim(); if(s && v && v!==a.nome) salvarCard(cid,{anexos:(PL.C[cid].anexos||[]).map(x=>x.id===a.id?{...x,nome:v}:x)}); else renderModal(); };
      i.onkeydown=e=>{ if(e.key==='Enter') fim(true); if(e.key==='Escape'){ e.stopPropagation(); fim(false); } }; i.onblur=()=>fim(true); };
    const bx=el('button',null,'Excluir'); bx.onclick=e=>confirmar(e.currentTarget,'Excluir o anexo “'+(a.nome||'')+'”?',async()=>{
      const cc=PL.C[cid]; const campos={anexos:(cc.anexos||[]).filter(x=>x.id!==a.id)}; if(a.asset && cc.capa===a.asset) campos.capa=null;
      await salvarCard(cid,campos,'removeu o anexo '+(a.nome||''));
      if(a.asset && assets){ assets.delete(a.asset).catch(()=>{}); } });
    ac.append(be,bx); info.append(ac); r.append(mini,info); w.append(r); });
  s.append(w); return s;
}
function popMover(cid, ancora){
  fecharMenus(); const c=PL.C[cid]; const m=el('div','pop'); m.append(el('h5',null,'Mover cartão'));
  const sq=el('select'); sq.id='mv-quadro'; quadrosOrd().forEach(([id,q])=>sq.append(new Option(q.nome,id))); sq.value=c.quadro;
  const slx=el('select'); slx.id='mv-lista'; const enche=()=>{ slx.textContent=''; listasDe(sq.value).forEach(([id,l])=>slx.append(new Option(l.nome,id))); if(sq.value===c.quadro) slx.value=c.lista; }; enche(); sq.onchange=enche;
  const ok=el('button','btn prim','Mover'); ok.onclick=()=>{ const lid=slx.value; if(!lid) return; const cs=cardsDe(lid); const mudouQ=sq.value!==c.quadro;
    salvarCard(cid,{quadro:sq.value,lista:lid,pos:(cs[cs.length-1]?.[1].pos??0)+1000, ...(mudouQ?{etiquetas:[]}:{})}, 'moveu este cartão para '+PL.Q[sq.value].nome+' › '+PL.L[lid].nome); m.remove(); if(mudouQ){ PL.q=sq.value; aplicaTema(); renderPlanner(); } };
  m.append(sq,slx,ok); posicionar(m,ancora);
}

// ---------- assinaturas ----------
// ---------- pessoas (login pela conta do claude.ai) ----------
const PERFIL={}; let perfisPedidos=new Set(); let quemFechado=false;
const slugNome=n=>n.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'pessoa';
function pessoaDe(nome){ return Object.values(PL.P||{}).find(p=>p.nome===nome); }
function meuNome(){ if(!meuId) return ''; const p=Object.values(PL.P||{}).find(p=>p.uid===meuId); return p?p.nome:''; }
function avEl(nome){
  const v=el('span','av'); v.title=nome; const p=pessoaDe(nome); const pr=p&&PERFIL[p.uid];
  if(pr && pr.avatarUrl){ const im=el('img'); im.src=pr.avatarUrl; im.alt=''; im.referrerPolicy='no-referrer'; im.onerror=()=>{ im.remove(); v.textContent=iniciais(nome); }; v.append(im); }
  else v.textContent=iniciais(nome);
  return v;
}
async function carregarPerfis(){
  if(!user) return; const novos=[...new Set(Object.values(PL.P).map(p=>p.uid).filter(u=>u && !perfisPedidos.has(u)))]; if(meuId && !perfisPedidos.has(meuId)) novos.push(meuId);
  if(!novos.length) return; novos.forEach(u=>perfisPedidos.add(u));
  try{ const ps=await user.profiles(novos); Object.assign(PERFIL,ps); renderPlanner(); if(PL.aberto) renderModal(); renderEu(); }catch(e){}
}
function renderEu(){
  const b=$('plEu'), q=$('plQuem'); if(!b||!q) return;
  if(!db || !meuId || !PL.carregado.p){ b.hidden=true; q.hidden=true; return; }
  const nome=meuNome();
  if(nome){ b.hidden=false; b.textContent=''; b.append(avEl(nome), el('span',null,nome)); b.title='Você está no Planner como '+nome+'. Clique para trocar.'; b.onclick=()=>{ quemFechado=false; mostrarQuem(true); }; q.hidden=true; }
  else { b.hidden=true; if(!quemFechado) mostrarQuem(false); }
}
function mostrarQuem(trocando){
  const q=$('plQuem'); q.textContent=''; q.hidden=false;
  const livres=equipe().filter(n=>{ const p=pessoaDe(n); return !p || !p.uid || p.uid===meuId; });
  q.append(el('b',null,trocando?'Trocar quem você é no Planner':'Quem é você no Planner?'));
  q.append(el('span','pl-aviso','Escolha seu nome uma vez. Depois disso, sua foto aparece nos cartões em que você é membro e o filtro “Meus cartões” passa a funcionar.'));
  const s=el('select'); s.id='quem-sel'; s.setAttribute('aria-label','Seu nome');
  s.append(new Option('Selecione seu nome…','')); livres.forEach(n=>s.append(new Option(n,n))); s.append(new Option('Não estou na lista (usar meu nome do Google)','__novo'));
  const ok=el('button','btn prim','Confirmar'); const dp=el('button','btn','Agora não');
  ok.onclick=async()=>{ if(!podeMexer()) return; let nome=s.value; if(!nome){ s.focus(); return; }
    if(nome==='__novo'){ const me=PERFIL[meuId]||(user?await user.me().catch(()=>null):null); nome=(me&&me.name)||''; if(!nome){ toast('Não consegui ler seu nome do Google. Escolha um nome da lista.'); return; } }
    ok.disabled=true;
    try{ const antigos=Object.entries(PL.P).filter(([id,p])=>p.uid===meuId && p.nome!==nome);
      for(const [id] of antigos) await db.doc('pp/'+id).update({uid:null});
      const ex=Object.entries(PL.P).find(([id,p])=>p.nome===nome);
      await db.doc('pp/'+(ex?ex[0]:slugNome(nome))).set({nome,uid:meuId,em:agoraISO()});
      quemFechado=true; q.hidden=true; toast('Pronto, você é '+nome+' no Planner'); }
    catch(e){ ok.disabled=false; toast('Não foi possível salvar. Tente de novo.'); } };
  dp.onclick=()=>{ quemFechado=true; q.hidden=true; };
  const w=el('div','linha'); w.append(s,ok,dp); q.append(w);
}
function iniciarPlanner(){
  try{ PL.recolhidas=new Set(JSON.parse(localStorage.getItem('wz-recolhidas')||'[]')); }catch(e){}
  if(!db){ renderPlanner(); return; }
  const marca=k=>()=>{ PL.carregado[k]=true; };
  const ouvir=(col,k,fn)=>db.collection(col).onSnapshot(s=>{ fn(s.docs); if(!s.metadata.fromCache) PL.carregado[k]=true; renderPlanner(); if(PL.aberto && !document.activeElement?.closest?.('.modal textarea,.modal input')) renderModal(); },
    ()=>{ PL.carregado[k]=true; toast('Não foi possível carregar parte do Planner.'); });
  ouvir('pq','q',docs=>{ PL.Q={}; docs.forEach(d=>PL.Q[d.id]=d.data()); if(!PL.q || !PL.Q[PL.q]) PL.q=(quadrosOrd()[0]||[])[0]||null; abrirHashPlanner(); });
  ouvir('pl','l',docs=>{ PL.L={}; docs.forEach(d=>PL.L[d.id]=d.data()); });
  ouvir('pe','e',docs=>{ PL.E={}; docs.forEach(d=>PL.E[d.id]=d.data()); });
  ouvir('pc','c',docs=>{ PL.C={}; docs.forEach(d=>PL.C[d.id]=d.data()); abrirHashPlanner(); });
  ouvir('pp','p',docs=>{ PL.P={}; docs.forEach(d=>PL.P[d.id]=d.data()); carregarPerfis(); renderEu(); });
  ouvir('pm','m',docs=>{ PL.M={}; docs.forEach(d=>{ const x={id:d.id,...d.data()}; (PL.M[x.card]=PL.M[x.card]||[]).push(x); }); });
  setTimeout(()=>{ if(!PL.carregado.c) { const B=$('plBoard'); if(B && PL.modo==='planner'){ B.textContent=''; B.append(el('div','vazio-pl','Os quadros ainda não responderam. Eles aparecem assim que a conexão voltar.')); } } },10000);
}
function abrirHashPlanner(){
  const h=(location.hash||'').slice(1);
  if(h.startsWith('card-')){ const id=h.slice(5); if(PL.C[id] && PL.aberto!==id){ abrirCard(id); } return true; }
  if(h==='planner' || h.startsWith('planner-')){ const q=h.slice(8); if(PL.modo!=='planner') modoPlanner(true, q||null); else if(q && PL.Q[q] && q!==PL.q){ PL.q=q; aplicaTema(); renderPlanner(); } return true; }
  return false;
}
function ligarPlanner(){
  document.querySelectorAll('.modos button').forEach(b=>b.onclick=()=>modoPlanner(b.dataset.m==='planner'));
  $('plBusca').oninput=e=>{ PL.f.txt=e.target.value.trim(); renderPlanner(); };
  $('plEtq').onchange=e=>{ PL.f.etq=e.target.value; renderPlanner(); };
  $('plMem').onchange=e=>{ PL.f.mem=e.target.value; renderPlanner(); };
  $('plPrazo').onchange=e=>{ PL.f.prazo=e.target.value; renderPlanner(); };
  $('plArq').onchange=e=>{ PL.f.arq=e.target.checked; renderPlanner(); };
  $('plLimpar').onclick=()=>{ PL.f={txt:'',etq:'',mem:'',prazo:'',arq:false}; $('plBusca').value=''; renderPlanner(); };
  document.querySelectorAll('#plVista button').forEach(b=>b.onclick=()=>{ PL.vista=b.dataset.v; renderPlanner(); });
  document.addEventListener('keydown',e=>{ if(PL.modo!=='planner') return; if(e.key==='Escape'){ if(document.querySelector('.menu,.pop')) fecharMenus(); else if(PL.aberto) fecharCard(); } });
}
ligarPlanner();

{ const h0=(location.hash||'').slice(1); const plan=h0==='planner'||h0.startsWith('planner-')||h0.startsWith('card-'); if(plan){ PL.modo='planner'; ir(0,0); modoPlanner(true, h0.startsWith('planner-')?h0.slice(8):null); try{ history.replaceState(null,'','#'+h0); }catch(e){} } else if(!abrirHash()) ir(0,0); }
window.addEventListener('hashchange',abrirHash);

(async()=>{
  const c=window.claude;
  if(!c?.use){ $('estado').textContent='Modo leitura.'; return; }
  [db,user,assets,downloads]=await Promise.all([c.use('db'),c.use('user'),c.use('assets').catch(()=>null),c.use('downloads').catch(()=>null)]);
  if(!db){ $('estado').textContent='Modo leitura.'; renderTudo(); renderPlanner(); return; }
  if(user){ meuId=await user.id(); dono=await user.isOwner(); const pw=await user.can('data.write'); podeEscrever = pw!==false; } else podeEscrever=true;
  renderTudo();
  iniciarPlanner();
  const pronto={s:false,n:false};
  const t=setTimeout(()=>{ if(!pronto.s||!pronto.n) $('estado').textContent='O registro ainda não respondeu. As avaliações aparecem assim que a conexão voltar.'; },10000);
  const ok=()=>{ if(pronto.s&&pronto.n){ clearTimeout(t); $('estado').textContent = podeEscrever ? 'Tudo o que você marca aqui fica salvo para a equipe e para o Claude.' : 'Você pode ver as avaliações, mas não alterar.'; } };
  db.collection('status').onSnapshot(s=>{ status={}; s.docs.forEach(d=>status[d.id]=d.data()); if(!s.metadata.fromCache){pronto.s=true;ok();} renderLista(); renderAval(); },
    ()=>{ clearTimeout(t); $('estado').textContent='Não foi possível carregar as avaliações.'; });
  db.collection('notas').onSnapshot(s=>{ notas=s.docs.map(d=>({id:d.id,...d.data()})); if(!s.metadata.fromCache){pronto.n=true;ok();} renderFila(); renderLista(); desenharPins(); renderTiras(); renderNotas(); },
    ()=>{ clearTimeout(t); $('estado').textContent='Não foi possível carregar as correções.'; });
})();
